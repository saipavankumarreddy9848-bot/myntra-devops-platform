version: "3.8"

services:
  auth-db:
    image: postgres:15
    container_name: auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "4000:4000"
    depends_on:
      - auth-db
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: authdb
      DB_HOST: auth-db
      DB_PORT: 5432
      JWT_SECRET: supersecretkey

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5000:5000"

volumes:
  auth-db-data:

